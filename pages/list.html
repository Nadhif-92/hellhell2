
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Reading</title>
    <link rel="stylesheet" href="../style/style.css">

</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="home-button"><a href="../index.html">
            Home
        </a></div>
        <div class="logo">MOOOOOOOOOOOOOOOOOOOO</div>
        <div class="header-box"></div>
    </header>


    <!-- DECORATIVE LEFT ILLUSTRATION -->
    <img
    src="../p0et4L.png"
    alt=""
    class="decoration left-doodle">


    <!-- MAIN PAGE -->
    <div class="page">

        <main class="main-content">

            <h1 class="page-title">
                MOOOOOOOOOOOOOOOOOOOOOO
            </h1>

            <!-- STORY LIST -->
            <section
                class="story-list"
                id="story-list"
                aria-live="polite"
            ></section>


            <!-- PAGINATION -->
            <nav
                class="pagination"
                id="pagination"
                aria-label="Pagination"
            ></nav>

        </main>


        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="filter-title">
                F I L T E R :
            </div>

            <div class="filter-content">

                <h2 class="filter-heading">
                    ---INCLUDE---
                </h2>

                <div
                    class="filter-list"
                    id="include-filters"
                ></div>

                <h2 class="filter-heading exclude-heading">
                    ---EXCLUDE---
                </h2>

                <div
                    class="filter-list"
                    id="exclude-filters"
                ></div>

                <button
                    type="button"
                    id="reset-filters"
                    class="reset-button"
                >
                    Reset filters
                </button>

            </div>
        </aside>

    </div>


    <!-- DECORATIVE BOTTOM-RIGHT ILLUSTRATION -->
    <img
    src="../ey4.png"
    alt=""
    class="decoration bottom-doodle">

    <script src="../script/stories.js"></script>
    <script src="../script/list.js"></script>

</body>
</html>
